# lilr-wgs runtime environment.
#
#   micromamba create -y -f environment.yml    (or conda/mamba env create -f)
#   micromamba activate lilr-wgs
#
# Two pins are deliberate and should not be relaxed without re-validating:
#
#   samtools/htslib  must be a build with libcurl. Reading a 1000 Genomes CRAM
#                    over HTTPS is the whole front end of this pipeline, and a
#                    samtools without libcurl fails on it with a bare "fail to
#                    open file" that looks like a bad path. `samtools --version`
#                    must list `libcurl=yes`; scripts/check_env.sh asserts it.
#
#   gatk4 4.2.6.0    the predecessor pinned this for HaplotypeCaller's ploidy
#                    behaviour above CN 2, which is exactly what LILRA6 needs.
#                    Later 4.x are not known to be wrong here, only untested
#                    against it; moving the pin means re-running the validation
#                    in validation/ and saying so.
name: lilr-wgs
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11

  # --- alignment and file handling ---
  - samtools>=1.19
  - bcftools>=1.19
  - htslib>=1.19
  - bowtie2>=2.5
  - bedtools>=2.31
  - bwa>=0.7.17          # only for rebuilding reference indices, not per sample

  # --- variant calling, phasing, annotation ---
  - gatk4=4.2.6.0
  - whatshap>=2.3
  - miniprot>=0.13

  # --- orchestration ---
  - snakemake-minimal>=8.0
  - snakemake-executor-plugin-cluster-generic

  # --- python ---
  - pysam>=0.22
  - numpy>=1.24
  - scipy>=1.11
  - scikit-learn>=1.3
  - pandas>=2.0
  - matplotlib-base>=3.7

  # --- development ---
  - pytest>=7.4
  - ruff>=0.4
