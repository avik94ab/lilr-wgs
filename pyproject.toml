[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "lilrwgs"
version = "0.1.0"
description = "LILR copy number and allele sequences from short-read WGS"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.11", "pysam>=0.22"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
